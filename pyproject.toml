[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethelgard"
version = "0.1.0"
description = "Тайловая RPG на Python + pygame-ce: открытый мир, процедурное подземелье, кооператив до 4 игроков"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Valerka3421" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "pygame-ce>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "coverage>=7.0",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.10",
    "isort>=5.13",
    "pre-commit>=3.7",
    "mutmut>=3.0",
]

[project.urls]
"Homepage" = "https://github.com/Valerka3421/rpg"
"Bug Tracker" = "https://github.com/Valerka3421/rpg/issues"

[tool.setuptools]
packages = ["core", "game", "render", "net", "audio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "benchmark: pytest-benchmark tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist", ".venv", "venv"]

[tool.ruff.lint]
# Включаем разумные наборы правил:
# E/W — pycodestyle errors/warnings
# F    — pyflakes (unused imports, undefined names)
# I    — isort
# B    — bugbear (частые баги)
# UP   — pyupgrade (упрощения под новую версию Python)
# SIM  — simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
# Игнорируем пока: E501 (длинные строки — gradual), B008 (function calls in defaults)
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]   # unused imports в тестах OK (фикстуры)
"core/data.py" = ["E501"]      # длинные словари данных

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "game", "render", "net", "audio"]

[tool.mypy]
python_version = "3.10"
# Пока не strict — вводим типизацию постепенно.
# Цель: core/ полностью типизирован, game/render/net — partial.
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
no_implicit_optional = true
check_untyped_defs = true
# pygame не имеет stubs — игнорируем
[[tool.mypy.overrides]]
module = ["pygame.*", "pygame_ce.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["core.*"]
disallow_untyped_defs = true       # core/ — строгий режим
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["game.*", "render.*", "net.*", "audio.*"]
disallow_untyped_defs = false      # остальное — постепенно

[tool.coverage.run]
source = ["core", "game", "net", "render", "audio"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "build/*",
    "dist/*",
]

[tool.coverage.report]
# Цели: core 80%, game 60%, render 50%. Общий fail_under = 70.
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pyright]
# Опционально — если кто-то использует Pyright/Pylance в VSCode
include = ["core", "game", "net"]
exclude = ["**/tests/**", "**/__pycache__/**"]
